name: ci

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_USER: postgres
          POSTGRES_DB: carecloud
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/carecloud
      VAPI_API_KEY: test
      VAPI_PUBLIC_KEY: test
      VAPI_WEBHOOK_SECRET: test-secret
      PUBLIC_BASE_URL: http://localhost:8000
      LLM_PROVIDER: groq
      CLINIC_TIMEZONE: America/New_York
      PYTHONPATH: .
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: pip install -r requirements.txt
      - name: Migrate
        run: alembic upgrade head
      - name: Lint
        run: ruff check app scripts tests --config ruff.toml
      - name: Test
        run: pytest -q
