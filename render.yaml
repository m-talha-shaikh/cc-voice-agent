services:
  - type: web
    name: carecloud-voice-agent
    runtime: docker
    plan: free
    region: ohio
    healthCheckPath: /healthz
    envVars:
      - key: DATABASE_URL
        sync: false
      - key: VAPI_API_KEY
        sync: false
      - key: VAPI_PUBLIC_KEY
        sync: false
      - key: VAPI_WEBHOOK_SECRET
        sync: false
      - key: VAPI_ASSISTANT_ID
        sync: false
      - key: VAPI_PHONE_NUMBER_ID
        sync: false
      - key: VAPI_PHONE_NUMBER
        sync: false
      - key: DEEPGRAM_API_KEY
        sync: false
      - key: GROQ_API_KEY
        sync: false
      - key: LLM_PROVIDER
        value: groq
      - key: PUBLIC_BASE_URL
        sync: false
      - key: CLINIC_TIMEZONE
        value: America/New_York
      - key: LOG_LEVEL
        value: INFO
